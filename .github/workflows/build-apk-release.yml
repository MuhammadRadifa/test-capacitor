name: Android APK Release

on:
  push:
    branches: [main, master, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Decode Keystore (if provided)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release.keystore
          cat > android/keystore.properties << EOF
          storeFile=app/release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
          echo "Keystore decoded to android/app/release.keystore"
          echo "keystore.properties created:"
          cat android/keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        working-directory: android
        run: |
          if [ -f keystore.properties ]; then
            echo "Keystore found - building SIGNED release APK"
            ./gradlew assembleRelease --stacktrace
          else
            echo "No keystore - building UNSIGNED release APK (no signingConfig)"
            ./gradlew assembleRelease --stacktrace || {
              echo "Release build failed (expected without keystore), continuing"
              exit 0
            }
          fi

      - name: List APK outputs
        if: always()
        run: |
          echo "=== Debug APKs ==="
          ls -lh android/app/build/outputs/apk/debug/ 2>&1 || echo "No debug APKs"
          echo "=== Release APKs ==="
          ls -lh android/app/build/outputs/apk/release/ 2>&1 || echo "No release APKs"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-release-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
